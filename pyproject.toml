[project]
name = "tradingzero"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ccxt>=4.0",
    "gymnasium>=0.29",
    "hypothesis>=6.0",
    "loguru>=0.7",
    "numpy>=1.26",
    "pandas>=2.0",
    "plotext>=5.0",
    "pyarrow>=24.0.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "stable-baselines3>=2.3",
    "textual>=0.60",
    "torch>=2.2",
    "wandb>=0.17",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=data --cov=env --cov=agent --cov=tui --cov-report=term-missing"

[tool.coverage.run]
source = ["data", "env", "agent", "tui"]

[tool.coverage.report]
fail_under = 70
show_missing = true

[tool.coverage.paths]
data = ["data/"]
env = ["env/"]
agent = ["agent/"]
tui = ["tui/"]
